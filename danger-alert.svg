<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 600 80">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .alert {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          padding: 12px 16px;
          border-left: 4px solid #cf222e;
          background: #ffebe9;
          border-radius: 6px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          font-size: 14px;
          color: #24292f;
        }
        .alert .icon {
          font-size: 16px;
          flex-shrink: 0;
        }
        .alert .title {
          font-weight: 600;
          color: #cf222e;
        }
      </style>
      <div class="alert">
        <span class="icon">⛔</span>
        <div>
          <span class="title">Danger:</span> This operation is irreversible and will permanently delete all data.
        </div>
      </div>
    </div>
  </foreignObject>
</svg>   
